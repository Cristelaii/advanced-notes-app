<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>📝 Simple Notes App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>📝 Simple Notes</h1>
      <div class="actions">
        <button id="clearAllBtn" class="danger">🗑️ Clear All</button>
      </div>
    </header>

  
    <section class="card">
      <h2 id="formTitle">Add a New Note</h2>
      <form id="noteForm">
        <input type="hidden" id="noteId" />
        <div class="field">
          <label for="title">Title</label>
          <input id="title" type="text" placeholder="Enter a note title" />
        </div>
        <div class="field">
          <label for="body">Details</label>
          <textarea id="body" rows="4" placeholder="Write your note..."></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" id="saveBtn">Save</button>
          <button type="button" id="cancelEditBtn" class="secondary hidden">Cancel</button>
        </div>
      </form>
    </section>

  
    <section class="filters card">
      <div class="field">
        <label for="search">Search notes</label>
        <input id="search" type="text" placeholder="Type to filter by title/body..." />
      </div>
      <div class="field">
        <label for="sort">Sort by</label>
        <select id="sort">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="title-asc">Title A→Z</option>
          <option value="title-desc">Title Z→A</option>
        </select>
      </div>
    </section>

    
    <section class="card">
      <h2>All Notes</h2>
      <div id="notesList" class="notes-list"></div>
      <div id="emptyState" class="empty hidden">No notes yet. Add your first one above 👆</div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
